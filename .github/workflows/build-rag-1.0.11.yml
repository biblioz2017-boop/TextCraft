name: Build TextCraft 1.0.11 verified RAG

on:
  push:
    branches: [ rag-scientific-pdf-patch ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Create temporary VSTO signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=TextCraft CI Temporary' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyExportPolicy Exportable `
            -KeySpec Signature
          "TEXTCRAFT_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure version and verified RAG indexing
        shell: pwsh
        run: |
          $project = 'TextCraft.csproj'
          $xml = Get-Content $project -Raw
          $xml = [regex]::Replace(
            $xml,
            '<ManifestCertificateThumbprint>[^<]*</ManifestCertificateThumbprint>',
            "<ManifestCertificateThumbprint>$env:TEXTCRAFT_CERT_THUMBPRINT</ManifestCertificateThumbprint>"
          )
          $xml = [regex]::Replace(
            $xml,
            '<ApplicationVersion>[^<]*</ApplicationVersion>',
            '<ApplicationVersion>1.0.11.0</ApplicationVersion>'
          )
          Set-Content $project $xml -Encoding UTF8

          $assemblyInfo = 'Properties/AssemblyInfo.cs'
          $assembly = Get-Content $assemblyInfo -Raw
          $assembly = [regex]::Replace($assembly, 'AssemblyVersion\("[^"]+"\)', 'AssemblyVersion("1.0.11.0")')
          $assembly = [regex]::Replace($assembly, 'AssemblyFileVersion\("[^"]+"\)', 'AssemblyFileVersion("1.0.11.0")')
          Set-Content $assemblyInfo $assembly -Encoding UTF8

          $path = './ci/build-patched.ps1'
          $script = Get-Content $path -Raw

          # The per-PDF HyperVectorDB constructor has auto-indexing disabled. The previous
          # build called IndexDocument(document) without first creating an index, ignored
          # the returned bool, and therefore could display [OK] even with zero vectors.
          $script = $script.Replace(
            '            IEnumerable<string> fileContent;',
            '            List<string> fileContent;'
          )
          $script = $script.Replace(
            '                fileContent = await ReadPdfFileAsync(filePath, CHUNK_LEN);',
            @'
                fileContent = (await ReadPdfFileAsync(filePath, CHUNK_LEN)).ToList();
                if (fileContent.Count == 0)
                {
                    MarkFileStatus(filePath, $"[NO TEXT] {Path.GetFileName(filePath)} (0 chunks)");
                    _activeIndexVersions.TryRemove(filePath, out _);
                    return;
                }
                MarkFileStatus(filePath, $"[INDEXING] {Path.GetFileName(filePath)} ({fileContent.Count} chunks)");
'@
          )
          $script = $script.Replace(
            '            var stagedDb = new HyperVectorDB.HyperVectorDB(ThisAddIn.Embedder, Path.GetTempPath());',
            @'
            var stagedDb = new HyperVectorDB.HyperVectorDB(ThisAddIn.Embedder, Path.GetTempPath());
            if (!stagedDb.CreateIndex(filePath))
                throw new InvalidOperationException($"Could not create vector index for {filePath}");
'@
          )
          $script = $script.Replace(
            '                    int fileContentCount = fileContent.Count();',
            '                    int fileContentCount = fileContent.Count;'
          )
          $script = $script.Replace(
            '                        stagedDb.IndexDocument(fileContent.ElementAt(i));',
            @'
                        if (!stagedDb.IndexDocument(filePath, fileContent[i]))
                            throw new InvalidOperationException($"Vector indexing failed for {Path.GetFileName(filePath)}, chunk {i + 1}/{fileContentCount}");
'@
          )

          $oldPublish = @'
            long currentVersion;
            if (_activeIndexVersions.TryGetValue(filePath, out currentVersion) && currentVersion == indexVersion)
                _fileDatabases[filePath] = stagedDb;
        }

        private void RemoveFileEntry(string filePath)
'@
          $newPublish = @'
            long currentVersion;
            if (_activeIndexVersions.TryGetValue(filePath, out currentVersion) && currentVersion == indexVersion)
            {
                _fileDatabases[filePath] = stagedDb;
                MarkFileStatus(filePath, $"[OK] {Path.GetFileName(filePath)} ({fileContent.Count} chunks)");
            }
        }

        private void MarkFileStatus(string filePath, string label)
        {
            Action update = () =>
            {
                for (int i = 0; i < _fileList.Count; i++)
                {
                    if (string.Equals(_fileList[i].Value, filePath, StringComparison.OrdinalIgnoreCase))
                    {
                        _fileList[i] = new KeyValuePair<string, string>(label, filePath);
                        break;
                    }
                }
            };

            if (this.InvokeRequired)
                this.Invoke((MethodInvoker)delegate { update(); });
            else
                update();
        }

        private void RemoveFileEntry(string filePath)
'@
          if (-not $script.Contains($oldPublish)) { throw 'Could not locate RAG publish block in build script' }
          $script = $script.Replace($oldPublish, $newPublish)

          $oldQueryBuilder = '            StringBuilder ragContext = new StringBuilder();'
          $newQueryBuilder = @'
            StringBuilder ragContext = new StringBuilder();
            ragContext.AppendLine("[RAG SOURCES READY]");
            foreach (var source in databases.OrderBy(item => item.Key, StringComparer.OrdinalIgnoreCase))
                ragContext.AppendLine($"- {Path.GetFileName(source.Key)}");
            ragContext.AppendLine();
'@
          if (-not $script.Contains($oldQueryBuilder)) { throw 'Could not locate RAG context builder in build script' }
          $script = $script.Replace($oldQueryBuilder, $newQueryBuilder.TrimEnd())

          # Optional MSI validation fails on hosted Actions; keep the working VSTO artifact.
          $script = $script.Replace(
            "Write-Host 'Build preparation complete.'",
            "Write-Host 'Build preparation complete.'`r`nexit 0"
          )
          Set-Content $path $script -Encoding UTF8

      - name: Build TextCraft
        shell: pwsh
        run: ./ci/build-patched.ps1

      - name: Verify vector index fix
        shell: pwsh
        run: |
          $source = Get-Content 'artifact\RAGControl.patched.cs' -Raw
          foreach ($marker in @(
            'CreateIndex(filePath)',
            'IndexDocument(filePath, fileContent[i])',
            '[INDEXING]',
            '[OK]',
            '[NO TEXT]',
            '[RAG SOURCES READY]'
          )) {
            if (-not $source.Contains($marker)) { throw "Missing verified RAG marker: $marker" }
          }
          Write-Host 'Verified: named vector index is created and every chunk insertion is checked.'

      - name: Package trust certificate and installer
        shell: pwsh
        run: |
          $cert = Get-Item "Cert:\CurrentUser\My\$env:TEXTCRAFT_CERT_THUMBPRINT"
          Export-Certificate -Cert $cert -FilePath 'artifact\TextCraft-CI.cer' -Force | Out-Null

          @'
          $ErrorActionPreference = 'Stop'
          $root = Split-Path -Parent $MyInvocation.MyCommand.Path
          Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
              try { Unblock-File -LiteralPath $_.FullName -ErrorAction Stop } catch { }
          }
          $certPath = Join-Path $root 'TextCraft-CI.cer'
          Import-Certificate -FilePath $certPath -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
          Import-Certificate -FilePath $certPath -CertStoreLocation 'Cert:\CurrentUser\TrustedPublisher' | Out-Null
          Start-Process -FilePath (Join-Path $root 'TextCraft.vsto')
          '@ | Set-Content -Path 'artifact\Install-TextCraft.ps1' -Encoding UTF8

          @'
          @echo off
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Install-TextCraft.ps1"
          if errorlevel 1 pause
          '@ | Set-Content -Path 'artifact\Install-TextCraft.cmd' -Encoding ASCII

          @'
          TextCraft patched scientific-RAG build 1.0.11.0

          This build fixes a false-positive [OK] state in the per-PDF vector database.
          [INDEXING] means embeddings are being created.
          [OK] is shown only after a named HyperVectorDB index exists and every chunk was successfully inserted.
          [NO TEXT] means no usable PDF text was extracted.
          '@ | Set-Content -Path 'artifact\INSTALL.txt' -Encoding UTF8

      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: TextCraft-1.0.11-verified-RAG
          path: artifact
          if-no-files-found: error
