name: Build НеZнайка

on:
  push:
    branches: [ simple-writing-ui ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86

      - name: Create temporary VSTO signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=NeZnaika CI Temporary' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyExportPolicy Exportable `
            -KeySpec Signature
          "NEZNAIKA_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $project = 'TextCraft.csproj'
          $xml = Get-Content $project -Raw
          $xml = [regex]::Replace(
            $xml,
            '<ManifestCertificateThumbprint>[^<]*</ManifestCertificateThumbprint>',
            "<ManifestCertificateThumbprint>$($cert.Thumbprint)</ManifestCertificateThumbprint>"
          )
          Set-Content $project $xml -Encoding UTF8

      - name: Validate owl resource
        shell: pwsh
        run: |
          $path = 'Assets\NeZnaikaOwl.jpg'
          if (-not (Test-Path $path)) { throw 'Owl JPEG is missing.' }
          $bytes = [System.IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 4 -or $bytes[0] -ne 0xFF -or $bytes[1] -ne 0xD8 -or $bytes[$bytes.Length - 2] -ne 0xFF -or $bytes[$bytes.Length - 1] -ne 0xD9) {
            throw 'Owl file is not a valid JPEG stream.'
          }
          Add-Type -AssemblyName System.Drawing
          $image = [System.Drawing.Image]::FromFile((Resolve-Path $path).Path)
          try {
            if ($image.Width -ne 192 -or $image.Height -ne 192) {
              throw "Unexpected owl dimensions: $($image.Width)x$($image.Height)"
            }
          }
          finally { $image.Dispose() }

      - name: Apply Fast RAG fix
        shell: pwsh
        run: ./ci/apply-v12-fast-rag.ps1

      - name: Build НеЗнайка 1.0.37
        shell: pwsh
        run: ./ci/build-patched.ps1

      - name: Verify НеЗнайка 1.0.37
        shell: pwsh
        run: |
          $targets = Get-Content 'Directory.Build.targets' -Raw
          foreach ($marker in @(
            '<ApplicationVersion>1.0.37.0</ApplicationVersion>',
            'Forge.Synonyms.cs',
            'Forge.SelectionInsights.cs',
            'GenerateUserControl.BeautifyRag.cs',
            'apply-beautify-rag-ui.ps1',
            'apply-beautify-citation-policy-v2.ps1',
            'set-neznaika-version-1.0.37.ps1'
          )) {
            if (-not $targets.Contains($marker)) { throw "Missing build marker: $marker" }
          }
          foreach ($forbidden in @('apply-synonyms-ribbon.ps1', 'apply-selection-insights-ribbon.ps1')) {
            if ($targets.Contains($forbidden)) { throw "Fragile build-time Ribbon patch is still enabled: $forbidden" }
          }

          $synonyms = Get-Content 'Forge.Synonyms.cs' -Raw
          foreach ($marker in @(
            'SynonymsButton_Click',
            'GetContextualSynonymsAsync',
            'SynonymPickerForm',
            'ReplaceSelectionWithSynonym',
            'TrackRevisions',
            'НЕТ БЕЗОПАСНОЙ ЗАМЕНЫ'
          )) {
            if (-not $synonyms.Contains($marker)) { throw "Missing synonym feature marker: $marker" }
          }

          $insights = Get-Content 'Forge.SelectionInsights.cs' -Raw
          foreach ($marker in @(
            'ExplainSelectionButton_Click',
            'ConclusionsSelectionButton_Click',
            'InsertSelectionInsightAsync',
            'Работай только с предоставленным выделенным фрагментом',
            'Не используй внешние знания как источник новых утверждений'
          )) {
            if (-not $insights.Contains($marker)) { throw "Missing selection insight marker: $marker" }
          }

          $designer = Get-Content 'Forge.Designer.cs' -Raw
          foreach ($marker in @(
            'this.SynonymsButton = this.Factory.CreateRibbonButton();',
            'this.ToolsGroup.Items.Add(this.SynonymsButton);',
            'this.SynonymsButton.Click += new Microsoft.Office.Tools.Ribbon.RibbonControlEventHandler(this.SynonymsButton_Click);',
            'this.ExplainSelectionButton = this.Factory.CreateRibbonButton();',
            'this.ToolsGroup.Items.Add(this.ExplainSelectionButton);',
            'this.ExplainSelectionButton.Click += new Microsoft.Office.Tools.Ribbon.RibbonControlEventHandler(this.ExplainSelectionButton_Click);',
            'this.ConclusionsSelectionButton = this.Factory.CreateRibbonButton();',
            'this.ToolsGroup.Items.Add(this.ConclusionsSelectionButton);',
            'this.ConclusionsSelectionButton.Click += new Microsoft.Office.Tools.Ribbon.RibbonControlEventHandler(this.ConclusionsSelectionButton_Click);'
          )) {
            if (-not $designer.Contains($marker)) { throw "Direct Ribbon feature is missing: $marker" }
          }

          $dllPath = (Resolve-Path 'artifact\TextCraft.dll').Path
          $assemblyVersion = [System.Reflection.AssemblyName]::GetAssemblyName($dllPath).Version.ToString()
          $fileVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($dllPath).FileVersion
          if ($assemblyVersion -ne '1.0.37.0') { throw "Unexpected DLL assembly version: $assemblyVersion" }
          if ($fileVersion -ne '1.0.37.0') { throw "Unexpected DLL file version: $fileVersion" }

          [xml]$appManifest = Get-Content 'artifact\TextCraft.dll.manifest' -Raw
          $appIdentity = $appManifest.SelectSingleNode("//*[local-name()='assemblyIdentity' and @name='TextCraft.dll']")
          if ($null -eq $appIdentity -or $appIdentity.version -ne '1.0.37.0') {
            throw 'Application manifest is not version 1.0.37.0.'
          }

          [xml]$deploymentManifest = Get-Content 'artifact\TextCraft.vsto' -Raw
          $deploymentIdentity = $deploymentManifest.SelectSingleNode("//*[local-name()='assemblyIdentity' and @name='TextCraft.vsto']")
          if ($null -eq $deploymentIdentity -or $deploymentIdentity.version -ne '1.0.37.0') {
            throw 'Deployment manifest is not version 1.0.37.0.'
          }

          $setup = Get-Content 'OfficeAddInSetup\OfficeAddInSetup.vdproj' -Raw
          if (-not $setup.Contains('"ProductVersion" = "8:1.0.37"')) {
            throw 'MSI project version is not 1.0.37.'
          }

      - name: Finalize and validate installer
        shell: pwsh
        run: ./ci/finalize-neznaika-installer.ps1

      - name: Verify classic installer
        shell: pwsh
        run: |
          foreach ($file in @(
            'artifact\00_INSTALL-NeZnaika.cmd',
            'artifact\INSTALL-NeZnaika.cmd',
            'artifact\Install-NeZnaika.ps1'
          )) {
            if (-not (Test-Path $file)) { throw "Missing classic installer file: $file" }
          }
          $installer = Get-Content 'artifact\Install-NeZnaika.ps1' -Raw
          foreach ($forbidden in @('LOCALAPPDATA', 'current.txt', 'Copy-PayloadToStableFolder', 'VSTOInstaller.exe')) {
            if ($installer.Contains($forbidden)) { throw "New installer behavior still present: $forbidden" }
          }
          if (-not $installer.Contains('msiexec.exe')) { throw 'Classic MSI installer path is missing.' }

      - name: Finalize НеЗнайка installer package
        shell: pwsh
        run: |
          $cert = Get-Item "Cert:\CurrentUser\My\$env:NEZNAIKA_CERT_THUMBPRINT"
          Export-Certificate -Cert $cert -FilePath 'artifact\NeZnaika-CI.cer' -Force | Out-Null
          Remove-Item 'artifact\Install-TextCraft.ps1' -Force -ErrorAction SilentlyContinue
          Remove-Item 'artifact\Install-TextCraft.cmd' -Force -ErrorAction SilentlyContinue
          Remove-Item 'artifact\INSTALL.txt' -Force -ErrorAction SilentlyContinue
          $msi = Get-ChildItem 'artifact' -File -Filter '*.msi' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi -and $msi.Name -ne 'NeZnaika-1.0.37-Setup.msi') {
            Rename-Item -LiteralPath $msi.FullName -NewName 'NeZnaika-1.0.37-Setup.msi' -Force
          }

      - name: Upload НеЗнайка 1.0.37
        uses: actions/upload-artifact@v4
        with:
          name: NeZnaika-1.0.37
          path: artifact
          if-no-files-found: error
