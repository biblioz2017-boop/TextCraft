name: Build НеZнайка

on:
  push:
    branches: [ simple-writing-ui ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86

      - name: Reset build patch marker
        shell: pwsh
        run: Remove-Item '.neznaika-patches-applied' -Force -ErrorAction SilentlyContinue

      - name: Create temporary VSTO signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=NeZnaika CI Temporary' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyExportPolicy Exportable `
            -KeySpec Signature
          "NEZNAIKA_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $project = 'TextCraft.csproj'
          $xml = Get-Content $project -Raw
          $xml = [regex]::Replace(
            $xml,
            '<ManifestCertificateThumbprint>[^<]*</ManifestCertificateThumbprint>',
            "<ManifestCertificateThumbprint>$($cert.Thumbprint)</ManifestCertificateThumbprint>"
          )
          Set-Content $project $xml -Encoding UTF8

      - name: Validate owl resource
        shell: pwsh
        run: |
          $path = 'Assets\NeZnaikaOwl.jpg'
          if (-not (Test-Path $path)) { throw 'Owl JPEG is missing.' }
          $bytes = [System.IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 4 -or $bytes[0] -ne 0xFF -or $bytes[1] -ne 0xD8 -or $bytes[$bytes.Length - 2] -ne 0xFF -or $bytes[$bytes.Length - 1] -ne 0xD9) {
            throw 'Owl file is not a valid JPEG stream.'
          }

      - name: Apply Fast RAG fix
        shell: pwsh
        run: ./ci/apply-v12-fast-rag.ps1

      - name: Prepare Visual Studio Installer Projects
        shell: pwsh
        run: ./ci/prepare-vdproj-commandline.ps1

      - name: Build НеЗнайка 1.0.40
        shell: pwsh
        run: ./ci/build-patched.ps1

      - name: Verify НеЗнайка 1.0.40
        shell: pwsh
        run: |
          if (-not (Test-Path '.neznaika-patches-applied')) {
            throw 'Single-pass build patch marker was not created.'
          }

          $targets = Get-Content 'Directory.Build.targets' -Raw
          foreach ($marker in @(
            '<ApplicationVersion>1.0.40.0</ApplicationVersion>',
            'NeZnaikaPatchMarker',
            'set-neznaika-version-1.0.40.ps1',
            'Forge.Synonyms.cs',
            'Forge.SelectionInsights.cs',
            'GenerateUserControl.BeautifyRag.cs'
          )) {
            if (-not $targets.Contains($marker)) { throw "Missing build marker: $marker" }
          }

          $markerValue = (Get-Content '.neznaika-patches-applied' -Raw).Trim()
          if ($markerValue -ne '1.0.40') { throw "Unexpected patch marker value: $markerValue" }

          $dllPath = (Resolve-Path 'artifact\TextCraft.dll').Path
          $assemblyVersion = [System.Reflection.AssemblyName]::GetAssemblyName($dllPath).Version.ToString()
          $fileVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($dllPath).FileVersion
          if ($assemblyVersion -ne '1.0.40.0') { throw "Unexpected DLL assembly version: $assemblyVersion" }
          if ($fileVersion -ne '1.0.40.0') { throw "Unexpected DLL file version: $fileVersion" }

          [xml]$appManifest = Get-Content 'artifact\TextCraft.dll.manifest' -Raw
          $appIdentity = $appManifest.SelectSingleNode("//*[local-name()='assemblyIdentity' and @name='TextCraft.dll']")
          if ($null -eq $appIdentity -or $appIdentity.version -ne '1.0.40.0') {
            throw 'Application manifest is not version 1.0.40.0.'
          }

          [xml]$deploymentManifest = Get-Content 'artifact\TextCraft.vsto' -Raw
          $deploymentIdentity = $deploymentManifest.SelectSingleNode("//*[local-name()='assemblyIdentity' and @name='TextCraft.vsto']")
          if ($null -eq $deploymentIdentity -or $deploymentIdentity.version -ne '1.0.40.0') {
            throw 'Deployment manifest is not version 1.0.40.0.'
          }

          $setup = Get-Content 'OfficeAddInSetup\OfficeAddInSetup.vdproj' -Raw
          if (-not $setup.Contains('"ProductVersion" = "8:1.0.40"')) {
            throw 'MSI project version is not 1.0.40.'
          }

          $msi = Get-ChildItem 'artifact' -File -Filter '*.msi' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Write-Host "Technical MSI output was produced: $($msi.Name) ($($msi.Length) bytes)"
          } else {
            Write-Host 'MSI was not produced; classic VSTO user package remains supported.'
          }

          $synonyms = Get-Content 'Forge.Synonyms.cs' -Raw
          foreach ($marker in @('SynonymsButton_Click','GetContextualSynonymsAsync','ReplaceSelectionWithSynonym','TrackRevisions')) {
            if (-not $synonyms.Contains($marker)) { throw "Missing synonym feature marker: $marker" }
          }

          $insights = Get-Content 'Forge.SelectionInsights.cs' -Raw
          foreach ($marker in @('ExplainSelectionButton_Click','ConclusionsSelectionButton_Click','InsertSelectionInsightAsync')) {
            if (-not $insights.Contains($marker)) { throw "Missing selection insight marker: $marker" }
          }

      - name: Finalize and validate installer
        shell: pwsh
        run: ./ci/finalize-neznaika-installer.ps1

      - name: Verify classic installer
        shell: pwsh
        run: |
          foreach ($file in @(
            'artifact\00_INSTALL-NeZnaika.cmd',
            'artifact\INSTALL-NeZnaika.cmd',
            'artifact\Install-NeZnaika.ps1'
          )) {
            if (-not (Test-Path $file)) { throw "Missing classic installer file: $file" }
          }
          $installer = Get-Content 'artifact\Install-NeZnaika.ps1' -Raw
          foreach ($forbidden in @('LOCALAPPDATA', 'current.txt', 'Copy-PayloadToStableFolder', 'VSTOInstaller.exe')) {
            if ($installer.Contains($forbidden)) { throw "New installer behavior still present: $forbidden" }
          }
          if (-not $installer.Contains('Start-Process -FilePath $vsto')) {
            throw 'Classic direct VSTO fallback is missing.'
          }

      - name: Finalize НеЗнайка installer package
        shell: pwsh
        run: |
          $cert = Get-Item "Cert:\CurrentUser\My\$env:NEZNAIKA_CERT_THUMBPRINT"
          Export-Certificate -Cert $cert -FilePath 'artifact\NeZnaika-CI.cer' -Force | Out-Null
          Remove-Item 'artifact\Install-TextCraft.ps1' -Force -ErrorAction SilentlyContinue
          Remove-Item 'artifact\Install-TextCraft.cmd' -Force -ErrorAction SilentlyContinue
          Remove-Item 'artifact\INSTALL.txt' -Force -ErrorAction SilentlyContinue

          $msi = Get-ChildItem 'artifact' -File -Filter '*.msi' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi -and $msi.Name -ne 'NeZnaika-1.0.40-Setup.msi') {
            Rename-Item -LiteralPath $msi.FullName -NewName 'NeZnaika-1.0.40-Setup.msi' -Force
          }

      - name: Create clean archive layout
        shell: pwsh
        run: ./ci/package-neznaika-friendly.ps1

      - name: Verify clean archive layout
        shell: pwsh
        run: |
          $root = @(Get-ChildItem 'artifact' -Force)
          if ($root.Count -ne 2) { throw "Artifact root must contain exactly 2 items; found $($root.Count)." }
          if (-not (Test-Path 'artifact\00_INSTALL-NeZnaika.cmd' -PathType Leaf)) { throw 'Root installer is missing.' }
          if (-not (Test-Path 'artifact\resources' -PathType Container)) { throw 'resources folder is missing.' }
          foreach ($required in @(
            'artifact\resources\Install-NeZnaika.ps1',
            'artifact\resources\NeZnaika-CI.cer',
            'artifact\resources\TextCraft.vsto',
            'artifact\resources\TextCraft.dll'
          )) {
            if (-not (Test-Path $required)) { throw "Missing packaged resource: $required" }
          }
          if (Get-ChildItem 'artifact\resources' -File -Filter '*.msi' -ErrorAction SilentlyContinue) {
            throw 'MSI must not be present in the classic user package.'
          }
          $launcher = Get-Content 'artifact\00_INSTALL-NeZnaika.cmd' -Raw
          if (-not $launcher.Contains('resources\Install-NeZnaika.ps1')) {
            throw 'Root launcher does not point to resources\Install-NeZnaika.ps1.'
          }

      - name: Upload НеЗнайка 1.0.40
        uses: actions/upload-artifact@v4
        with:
          name: NeZnaika-1.0.40
          path: artifact
          if-no-files-found: error
