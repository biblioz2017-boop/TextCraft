name: Build НеZнайка

on:
  push:
    branches: [ simple-writing-ui ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86

      - name: Create temporary VSTO signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=NeZnaika CI Temporary' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyExportPolicy Exportable `
            -KeySpec Signature
          "NEZNAIKA_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $project = 'TextCraft.csproj'
          $xml = Get-Content $project -Raw
          $xml = [regex]::Replace(
            $xml,
            '<ManifestCertificateThumbprint>[^<]*</ManifestCertificateThumbprint>',
            "<ManifestCertificateThumbprint>$($cert.Thumbprint)</ManifestCertificateThumbprint>"
          )
          Set-Content $project $xml -Encoding UTF8

      - name: Rebuild owl JPEG from stable PNG
        shell: pwsh
        run: |
          $source = 'Assets\NeZnaikaOwl.normalized.png'
          $target = 'Assets\NeZnaikaOwl.jpg'
          if (-not (Test-Path $source)) { throw 'Stable owl PNG is missing.' }

          $png = [System.IO.File]::ReadAllBytes($source)
          $sig = [byte[]](0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A)
          if ($png.Length -lt $sig.Length) { throw 'Stable owl PNG is too short.' }
          for ($i = 0; $i -lt $sig.Length; $i++) {
            if ($png[$i] -ne $sig[$i]) { throw 'Stable owl source is not a PNG.' }
          }

          Add-Type -AssemblyName System.Drawing
          Remove-Item -LiteralPath $target -Force -ErrorAction SilentlyContinue
          $image = [System.Drawing.Image]::FromFile((Resolve-Path $source).Path)
          try {
            $bitmap = New-Object System.Drawing.Bitmap($image)
            try {
              $bitmap.Save((Join-Path (Get-Location) $target), [System.Drawing.Imaging.ImageFormat]::Jpeg)
            }
            finally {
              $bitmap.Dispose()
            }
          }
          finally {
            $image.Dispose()
          }

          $jpeg = [System.IO.File]::ReadAllBytes($target)
          if ($jpeg.Length -lt 4 -or $jpeg[0] -ne 0xFF -or $jpeg[1] -ne 0xD8 -or $jpeg[$jpeg.Length - 2] -ne 0xFF -or $jpeg[$jpeg.Length - 1] -ne 0xD9) {
            throw 'Rebuilt owl JPEG is invalid.'
          }
          Write-Host "Rebuilt owl JPEG from stable PNG: $($jpeg.Length) bytes."

      - name: Validate original owl resource
        shell: pwsh
        run: |
          $path = 'Assets\NeZnaikaOwl.jpg'
          if (-not (Test-Path $path)) { throw 'Original owl JPEG is missing.' }
          $bytes = [System.IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 4 -or $bytes[0] -ne 0xFF -or $bytes[1] -ne 0xD8 -or $bytes[$bytes.Length - 2] -ne 0xFF -or $bytes[$bytes.Length - 1] -ne 0xD9) {
            throw 'Original owl file is not a valid JPEG stream.'
          }
          Write-Host "Verified original owl JPEG: $($bytes.Length) bytes."

      - name: Apply Fast RAG fix
        shell: pwsh
        run: ./ci/apply-v12-fast-rag.ps1

      - name: Build НеZнайка 1.0.14
        shell: pwsh
        run: ./ci/build-patched.ps1

      - name: Verify НеZнайка branding and About dialog
        shell: pwsh
        run: |
          $about = Get-Content 'AboutBox.cs' -Raw
          foreach ($marker in @(
            'НеZнайка',
            'Надстройка, созданная во имя текста, правок и человеческих страданий.',
            'Вместе с НеZнайкой мы натянем любую сову на глобус!',
            'И не забывайте страдать!',
            'TextForge.NeZnaikaOwl.jpg'
          )) {
            if (-not $about.Contains($marker)) { throw "Missing About marker: $marker" }
          }

          $resx = Get-Content 'AboutBox.resx' -Raw
          if ($resx.Contains('name="logoPictureBox.Image"')) {
            throw 'AboutBox.resx still contains a System.Drawing.Image.'
          }

          $targets = Get-Content 'Directory.Build.targets' -Raw
          foreach ($marker in @(
            '<ApplicationVersion>1.0.14.0</ApplicationVersion>',
            'Assets\NeZnaikaOwl.jpg',
            '<LogicalName>TextForge.NeZnaikaOwl.jpg</LogicalName>',
            '<Type>Non-Resx</Type>'
          )) {
            if (-not $targets.Contains($marker)) { throw "Missing build target marker: $marker" }
          }

          if (-not (Test-Path 'artifact\00_INSTALL-NeZnaika.cmd')) {
            throw 'Primary НеZнайка installer is missing.'
          }

      - name: Finalize and validate installer
        shell: pwsh
        run: ./ci/finalize-neznaika-installer.ps1

      - name: Finalize НеZнайка installer package
        shell: pwsh
        run: |
          $cert = Get-Item "Cert:\CurrentUser\My\$env:NEZNAIKA_CERT_THUMBPRINT"
          Export-Certificate -Cert $cert -FilePath 'artifact\NeZnaika-CI.cer' -Force | Out-Null
          Remove-Item 'artifact\Install-TextCraft.ps1' -Force -ErrorAction SilentlyContinue
          Remove-Item 'artifact\Install-TextCraft.cmd' -Force -ErrorAction SilentlyContinue
          Remove-Item 'artifact\INSTALL.txt' -Force -ErrorAction SilentlyContinue
          $msi = Get-ChildItem 'artifact' -File -Filter '*.msi' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi -and $msi.Name -ne 'NeZnaika-1.0.14-Setup.msi') {
            Rename-Item -LiteralPath $msi.FullName -NewName 'NeZnaika-1.0.14-Setup.msi' -Force
          }

      - name: Upload НеZнайка 1.0.14
        uses: actions/upload-artifact@v4
        with:
          name: NeZnaika-1.0.14
          path: artifact
          if-no-files-found: error
