name: Build НеZнайка

on:
  push:
    branches: [ simple-writing-ui ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86

      - name: Create temporary VSTO signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=NeZnaika CI Temporary' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyExportPolicy Exportable `
            -KeySpec Signature
          "NEZNAIKA_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $project = 'TextCraft.csproj'
          $xml = Get-Content $project -Raw
          $xml = [regex]::Replace(
            $xml,
            '<ManifestCertificateThumbprint>[^<]*</ManifestCertificateThumbprint>',
            "<ManifestCertificateThumbprint>$($cert.Thumbprint)</ManifestCertificateThumbprint>"
          )
          Set-Content $project $xml -Encoding UTF8

      - name: Validate owl resource
        shell: pwsh
        run: |
          $path = 'Assets\NeZnaikaOwl.jpg'
          if (-not (Test-Path $path)) { throw 'Owl JPEG is missing.' }
          $bytes = [System.IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 4 -or $bytes[0] -ne 0xFF -or $bytes[1] -ne 0xD8 -or $bytes[$bytes.Length - 2] -ne 0xFF -or $bytes[$bytes.Length - 1] -ne 0xD9) {
            throw 'Owl file is not a valid JPEG stream.'
          }
          Add-Type -AssemblyName System.Drawing
          $image = [System.Drawing.Image]::FromFile((Resolve-Path $path).Path)
          try {
            if ($image.Width -ne 192 -or $image.Height -ne 192) {
              throw "Unexpected owl dimensions: $($image.Width)x$($image.Height)"
            }
          }
          finally {
            $image.Dispose()
          }

      - name: Apply Fast RAG fix
        shell: pwsh
        run: ./ci/apply-v12-fast-rag.ps1

      - name: Build НеZнайка 1.0.24
        shell: pwsh
        run: ./ci/build-patched.ps1

      - name: Verify НеZнайка 1.0.24
        shell: pwsh
        run: |
          $targets = Get-Content 'Directory.Build.targets' -Raw
          if (-not $targets.Contains('<ApplicationVersion>1.0.24.0</ApplicationVersion>')) {
            throw 'Build targets do not declare NeZnaika 1.0.24.'
          }
          foreach ($marker in @(
            'apply-audit-headless-review.ps1',
            'apply-chat-scroll-fix.ps1',
            'repair-rag-cache-v2.ps1',
            'repair-rag-auto-topic-idempotence.ps1',
            'apply-rag-auto-topic.ps1',
            'repair-rag-auto-topic-linq.ps1',
            'apply-rag-overview-routing.ps1',
            'set-neznaika-version-1.0.24.ps1',
            'RAGControl.Overview.cs'
          )) {
            if (-not $targets.Contains($marker)) { throw "Missing build patch: $marker" }
          }

          $science = Get-Content 'GenerateUserControl.Science.cs' -Raw
          $rag = Get-Content 'RAGControl.cs' -Raw
          $ragScience = Get-Content 'RAGControl.Science.cs' -Raw
          $overview = Get-Content 'RAGControl.Overview.cs' -Raw
          $auditPanel = Get-Content 'GenerateUserControl.AuditPanel.cs' -Raw
          foreach ($marker in @(
            'using System.Linq;',
            'IsGenericAttachedSourceRequest',
            'GetCheckedPdfOverviewEvidence(10)',
            'ScrollResponseToEnd();'
          )) {
            if (-not $science.Contains($marker)) { throw "Missing science marker: $marker" }
          }
          foreach ($marker in @(
            'BuildCheckedPdfTopicSeedAsync',
            'BuildCheckedPdfTopicSeed',
            'FileListBox.CheckedItems'
          )) {
            if (-not $rag.Contains($marker)) { throw "Missing RAG auto-topic marker: $marker" }
          }
          foreach ($marker in @(
            'NeZnaika-RAG-cache-v2|',
            'cached.Indexes.Values.Any(index => index != null && index.Count > 0)'
          )) {
            if (-not $ragScience.Contains($marker)) { throw "Missing RAG cache marker: $marker" }
          }
          foreach ($marker in @(
            'GetCheckedPdfOverviewEvidence',
            'GetCheckedRagPaths()',
            'PdfDocument.Open(filePath)',
            'BuildRepresentativePagePlan',
            'ReadOverviewPageText'
          )) {
            if (-not $overview.Contains($marker)) { throw "Missing direct-PDF overview marker: $marker" }
          }
          if ($overview.Contains('QueryCosineSimilarity(')) {
            throw 'Generic overview still depends on semantic vector retrieval.'
          }
          if (-not $auditPanel.Contains('Headless review mode: stage 2 still runs through the LLM')) {
            throw 'Headless audit review mode is missing.'
          }
          if (-not $auditPanel.Contains('List<AuditReviewIssue> issues = await GenerateAuditReviewIssuesAsync(')) {
            throw 'Mandatory LLM audit stage 2 is missing.'
          }

          $dllPath = (Resolve-Path 'artifact\TextCraft.dll').Path
          $assemblyVersion = [System.Reflection.AssemblyName]::GetAssemblyName($dllPath).Version.ToString()
          $fileVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($dllPath).FileVersion
          if ($assemblyVersion -ne '1.0.24.0') {
            throw "Unexpected TextCraft.dll assembly version: $assemblyVersion"
          }
          if ($fileVersion -ne '1.0.24.0') {
            throw "Unexpected TextCraft.dll file version: $fileVersion"
          }

          [xml]$appManifest = Get-Content 'artifact\TextCraft.dll.manifest' -Raw
          $applicationIdentity = $appManifest.SelectSingleNode("//*[local-name()='assemblyIdentity' and @name='TextCraft.dll']")
          if ($null -eq $applicationIdentity -or $applicationIdentity.version -ne '1.0.24.0') {
            throw 'Application manifest is not version 1.0.24.0.'
          }

          [xml]$deploymentManifest = Get-Content 'artifact\TextCraft.vsto' -Raw
          $deploymentIdentity = $deploymentManifest.SelectSingleNode("//*[local-name()='assemblyIdentity' and @name='TextCraft.vsto']")
          if ($null -eq $deploymentIdentity -or $deploymentIdentity.version -ne '1.0.24.0') {
            throw 'Deployment manifest is not version 1.0.24.0.'
          }

          $setup = Get-Content 'OfficeAddInSetup\OfficeAddInSetup.vdproj' -Raw
          if (-not $setup.Contains('"ProductVersion" = "8:1.0.24"')) {
            throw 'MSI project version is not 1.0.24.'
          }

          if (-not (Test-Path 'artifact\00_INSTALL-NeZnaika.cmd')) {
            throw 'Primary NeZnaika installer is missing.'
          }

      - name: Finalize and validate installer
        shell: pwsh
        run: ./ci/finalize-neznaika-installer.ps1

      - name: Finalize НеZнайка installer package
        shell: pwsh
        run: |
          $cert = Get-Item "Cert:\CurrentUser\My\$env:NEZNAIKA_CERT_THUMBPRINT"
          Export-Certificate -Cert $cert -FilePath 'artifact\NeZnaika-CI.cer' -Force | Out-Null
          Remove-Item 'artifact\Install-TextCraft.ps1' -Force -ErrorAction SilentlyContinue
          Remove-Item 'artifact\Install-TextCraft.cmd' -Force -ErrorAction SilentlyContinue
          Remove-Item 'artifact\INSTALL.txt' -Force -ErrorAction SilentlyContinue
          $msi = Get-ChildItem 'artifact' -File -Filter '*.msi' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi -and $msi.Name -ne 'NeZnaika-1.0.24-Setup.msi') {
            Rename-Item -LiteralPath $msi.FullName -NewName 'NeZnaika-1.0.24-Setup.msi' -Force
          }

      - name: Upload НеZнайка 1.0.24
        uses: actions/upload-artifact@v4
        with:
          name: NeZnaika-1.0.24
          path: artifact
          if-no-files-found: error
