name: Build TextCraft PR

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Disable manifest signing in CI
        shell: pwsh
        run: |
          $path = './ci/build-patched.ps1'
          $c = Get-Content $path -Raw
          $c = $c.Replace('msbuild TextCraft.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU', 'msbuild TextCraft.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /p:SignManifests=false /p:SignAssembly=false')
          Set-Content $path $c -Encoding UTF8

      - name: Build patched TextCraft
        shell: pwsh
        run: ./ci/build-patched.ps1

      - name: Upload patched build
        uses: actions/upload-artifact@v4
        with:
          name: TextCraft-patched-scientific-RAG
          path: artifact
          if-no-files-found: error
