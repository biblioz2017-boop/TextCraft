name: Build TextCraft PR

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Create temporary VSTO signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=TextCraft CI Temporary' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyExportPolicy Exportable `
            -KeySpec Signature
          "TEXTCRAFT_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure TextCraft 1.0.11 signing and version
        shell: pwsh
        run: |
          $project = 'TextCraft.csproj'
          $xml = Get-Content $project -Raw
          $xml = [regex]::Replace(
            $xml,
            '<ManifestCertificateThumbprint>[^<]*</ManifestCertificateThumbprint>',
            "<ManifestCertificateThumbprint>$env:TEXTCRAFT_CERT_THUMBPRINT</ManifestCertificateThumbprint>"
          )
          $xml = [regex]::Replace(
            $xml,
            '<ApplicationVersion>[^<]*</ApplicationVersion>',
            '<ApplicationVersion>1.0.11.0</ApplicationVersion>'
          )
          Set-Content $project $xml -Encoding UTF8

          $assemblyInfo = 'Properties/AssemblyInfo.cs'
          $assembly = Get-Content $assemblyInfo -Raw
          $assembly = [regex]::Replace($assembly, 'AssemblyVersion\("[^"]+"\)', 'AssemblyVersion("1.0.11.0")')
          $assembly = [regex]::Replace($assembly, 'AssemblyFileVersion\("[^"]+"\)', 'AssemblyFileVersion("1.0.11.0")')
          Set-Content $assemblyInfo $assembly -Encoding UTF8

      - name: Apply verified RAG fix
        shell: pwsh
        run: ./ci/apply-v11-fix.ps1

      - name: Build TextCraft
        shell: pwsh
        run: ./ci/build-patched.ps1

      - name: Verify vector index fix
        shell: pwsh
        run: |
          $source = Get-Content 'artifact\RAGControl.patched.cs' -Raw
          foreach ($marker in @(
            'CreateIndex(filePath)',
            'IndexDocument(filePath, fileContent[i])',
            '[INDEXING]',
            '[OK]',
            '[NO TEXT]'
          )) {
            if (-not $source.Contains($marker)) { throw "Missing verified RAG marker: $marker" }
          }
          Write-Host 'Verified named vector index, checked chunk insertion, and indexing status markers.'

      - name: Package trust certificate and installer
        shell: pwsh
        run: |
          $cert = Get-Item "Cert:\CurrentUser\My\$env:TEXTCRAFT_CERT_THUMBPRINT"
          Export-Certificate -Cert $cert -FilePath 'artifact\TextCraft-CI.cer' -Force | Out-Null

          @'
          $ErrorActionPreference = 'Stop'
          $root = Split-Path -Parent $MyInvocation.MyCommand.Path
          Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
              try { Unblock-File -LiteralPath $_.FullName -ErrorAction Stop } catch { }
          }
          $certPath = Join-Path $root 'TextCraft-CI.cer'
          Import-Certificate -FilePath $certPath -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
          Import-Certificate -FilePath $certPath -CertStoreLocation 'Cert:\CurrentUser\TrustedPublisher' | Out-Null
          Start-Process -FilePath (Join-Path $root 'TextCraft.vsto')
          '@ | Set-Content -Path 'artifact\Install-TextCraft.ps1' -Encoding UTF8

          @'
          @echo off
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Install-TextCraft.ps1"
          if errorlevel 1 pause
          '@ | Set-Content -Path 'artifact\Install-TextCraft.cmd' -Encoding ASCII

          @'
          TextCraft patched scientific-RAG build 1.0.11.0

          [INDEXING] means embeddings are being created.
          [OK] is shown only after a named HyperVectorDB index exists and every chunk insertion has succeeded.
          [NO TEXT] means no usable PDF text was extracted.
          '@ | Set-Content -Path 'artifact\INSTALL.txt' -Encoding UTF8

      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: TextCraft-1.0.11-verified-RAG
          path: artifact
          if-no-files-found: error
