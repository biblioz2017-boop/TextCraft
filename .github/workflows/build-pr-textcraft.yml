name: Build TextCraft PR

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Create temporary VSTO signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=TextCraft CI Temporary' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyExportPolicy Exportable `
            -KeySpec Signature
          "TEXTCRAFT_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Created temporary certificate $($cert.Thumbprint)"

      - name: Configure CI signing, version and RAG diagnostics
        shell: pwsh
        run: |
          $project = 'TextCraft.csproj'
          $xml = Get-Content $project -Raw
          $xml = [regex]::Replace(
            $xml,
            '<ManifestCertificateThumbprint>[^<]*</ManifestCertificateThumbprint>',
            "<ManifestCertificateThumbprint>$env:TEXTCRAFT_CERT_THUMBPRINT</ManifestCertificateThumbprint>"
          )
          $xml = [regex]::Replace(
            $xml,
            '<ApplicationVersion>[^<]*</ApplicationVersion>',
            '<ApplicationVersion>1.0.10.0</ApplicationVersion>'
          )
          Set-Content $project $xml -Encoding UTF8

          $assemblyInfo = 'Properties/AssemblyInfo.cs'
          $assembly = Get-Content $assemblyInfo -Raw
          $assembly = $assembly.Replace('AssemblyVersion("1.0.8.0")', 'AssemblyVersion("1.0.10.0")')
          $assembly = $assembly.Replace('AssemblyFileVersion("1.0.8.0")', 'AssemblyFileVersion("1.0.10.0")')
          Set-Content $assemblyInfo $assembly -Encoding UTF8

          # ci/build-patched.ps1 first applies the scientific-PDF and multi-document
          # patch to RAGControl.cs. Inject this block immediately after that source patch,
          # while $c contains the final C# source but before it is written and compiled.
          $path = './ci/build-patched.ps1'
          $script = Get-Content $path -Raw
          $marker = '$c = $c.Substring(0, $start) + $replacement + $c.Substring($end)'
          if (-not $script.Contains($marker)) { throw 'Could not locate final RAG source patch marker' }

          $injection = @'
          # Final RAG diagnostics patch. At this point $c is patched RAGControl.cs.
          $diagFieldOld = '        private ConcurrentDictionary<string, long> _activeIndexVersions = new ConcurrentDictionary<string, long>(StringComparer.OrdinalIgnoreCase);'
          $diagFieldNew = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('ICAgICAgICBwcml2YXRlIENvbmN1cnJlbnREaWN0aW9uYXJ5PHN0cmluZywgTGlzdDxzdHJpbmc+PiBfZmlsZUNodW5rcyA9IG5ldyBDb25jdXJyZW50RGljdGlvbmFyeTxzdHJpbmcsIExpc3Q8c3RyaW5nPj4oU3RyaW5nQ29tcGFyZXIuT3JkaW5hbElnbm9yZUNhc2UpOw=='))
          if (-not $c.Contains($diagFieldOld)) { throw 'Could not locate RAG index-version field' }
          $c = $c.Replace($diagFieldOld, $diagFieldOld + "`r`n" + $diagFieldNew)

          $c = $c.Replace(
              '            _activeIndexVersions.Clear();',
              "            _activeIndexVersions.Clear();`r`n            _fileChunks.Clear();"
          )

          $diagIndexStart = $c.IndexOf('        private async Task IndexDocumentAsync(string filePath)')
          $diagIndexEnd = $c.IndexOf('        private void RemoveFileEntry(string filePath)', $diagIndexStart)
          if ($diagIndexStart -lt 0 -or $diagIndexEnd -lt 0) { throw 'Could not locate patched IndexDocumentAsync' }
          $diagIndexReplacement = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          $c = $c.Substring(0, $diagIndexStart) + $diagIndexReplacement + $c.Substring($diagIndexEnd)

          $diagDeleteOld = "        private bool DeleteDocument(string filePath)`r`n        {`r`n            HyperVectorDB.HyperVectorDB removed;`r`n            return _fileDatabases.TryRemove(filePath, out removed);`r`n        }"
          if (-not $c.Contains($diagDeleteOld)) {
              $diagDeleteOld = $diagDeleteOld.Replace("`r`n", "`n")
          }
          $diagDeleteNew = $diagDeleteOld.Replace('            return _fileDatabases.TryRemove(filePath, out removed);', "            _fileChunks.TryRemove(filePath, out _);`r`n            return _fileDatabases.TryRemove(filePath, out removed);")
          if ($diagDeleteOld.Contains("`n") -and -not $diagDeleteOld.Contains("`r`n")) { $diagDeleteNew = $diagDeleteNew.Replace("`r`n", "`n") }
          if (-not $c.Contains($diagDeleteOld)) { throw 'Could not locate DeleteDocument in patched RAG source' }
          $c = $c.Replace($diagDeleteOld, $diagDeleteNew)

          $diagRagStart = $c.IndexOf('        public string GetRAGContext(string query, int maxTokens)')
          $diagRagEnd = $c.IndexOf('        // UTILS', $diagRagStart)
          if ($diagRagStart -lt 0 -or $diagRagEnd -lt 0) { throw 'Could not locate patched GetRAGContext' }
          $diagRagReplacement = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          $c = $c.Substring(0, $diagRagStart) + $diagRagReplacement + $c.Substring($diagRagEnd)
          '@

          $script = $script.Replace($marker, $marker + "`r`n" + $injection)

          # A failed optional MSI build must not suppress the successfully built VSTO binaries.
          $script = $script.Replace(
            "Write-Host 'Build preparation complete.'",
            "Write-Host 'Build preparation complete.'`r`nexit 0"
          )
          Set-Content $path $script -Encoding UTF8

      - name: Build patched TextCraft
        shell: pwsh
        run: ./ci/build-patched.ps1

      - name: Package trust certificate and installer
        shell: pwsh
        run: |
          $cert = Get-Item "Cert:\CurrentUser\My\$env:TEXTCRAFT_CERT_THUMBPRINT"
          Export-Certificate -Cert $cert -FilePath 'artifact\TextCraft-CI.cer' -Force | Out-Null

          @'
          $ErrorActionPreference = 'Stop'
          $root = Split-Path -Parent $MyInvocation.MyCommand.Path
          Write-Host 'TextCraft patched build installer'
          Write-Host 'This installs the build certificate only for the current Windows user.'

          Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
              try { Unblock-File -LiteralPath $_.FullName -ErrorAction Stop } catch { }
          }

          $certPath = Join-Path $root 'TextCraft-CI.cer'
          if (-not (Test-Path $certPath)) { throw "Certificate not found: $certPath" }

          Import-Certificate -FilePath $certPath -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
          Import-Certificate -FilePath $certPath -CertStoreLocation 'Cert:\CurrentUser\TrustedPublisher' | Out-Null
          Write-Host 'Certificate trusted for current user.'

          $vsto = Join-Path $root 'TextCraft.vsto'
          if (-not (Test-Path $vsto)) { throw "VSTO manifest not found: $vsto" }
          Write-Host 'Starting VSTO installer...'
          Start-Process -FilePath $vsto
          '@ | Set-Content -Path 'artifact\Install-TextCraft.ps1' -Encoding UTF8

          @'
          @echo off
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Install-TextCraft.ps1"
          if errorlevel 1 pause
          '@ | Set-Content -Path 'artifact\Install-TextCraft.cmd' -Encoding ASCII

          @'
          TextCraft patched scientific-RAG build 1.0.10.0

          Installation:
          1. Close Microsoft Word completely.
          2. Double-click Install-TextCraft.cmd.
          3. The script trusts only the included self-signed TextCraft CI certificate for the current Windows user, then starts TextCraft.vsto.
          4. Re-open Word after installation.

          RAG list states:
          [INDEXING] = PDF text was extracted and embeddings are still being created.
          [OK]       = PDF is ready and can be used by Generate.
          [NO TEXT]  = PdfPig could not extract usable text from that PDF.

          If Windows blocks the downloaded ZIP or extracted files, the installer script removes Mark-of-the-Web from this extracted folder before launching VSTO.
          '@ | Set-Content -Path 'artifact\INSTALL.txt' -Encoding UTF8

      - name: Verify diagnostic markers in packaged source
        shell: pwsh
        run: |
          $source = Get-Content 'artifact\RAGControl.patched.cs' -Raw
          foreach ($marker in @('[INDEXING]', '[OK]', '[NO TEXT]', '[RAG SOURCES READY]', '_fileChunks')) {
              if (-not $source.Contains($marker)) { throw "Missing diagnostic marker: $marker" }
          }
          Write-Host 'RAG diagnostic markers verified.'

      - name: Upload patched build
        uses: actions/upload-artifact@v4
        with:
          name: TextCraft-patched-scientific-RAG
          path: artifact
          if-no-files-found: error
