name: Build TextCraft PR

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Create temporary VSTO signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=TextCraft CI Temporary' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyExportPolicy Exportable `
            -KeySpec Signature
          "TEXTCRAFT_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Created temporary certificate $($cert.Thumbprint)"

      - name: Configure CI manifest signing
        shell: pwsh
        run: |
          $project = 'TextCraft.csproj'
          $xml = Get-Content $project -Raw
          $xml = [regex]::Replace(
            $xml,
            '<ManifestCertificateThumbprint>[^<]*</ManifestCertificateThumbprint>',
            "<ManifestCertificateThumbprint>$env:TEXTCRAFT_CERT_THUMBPRINT</ManifestCertificateThumbprint>"
          )
          Set-Content $project $xml -Encoding UTF8

          # Setup Projects can fail under out-of-process build with HRESULT 8000000A.
          # Use the helper installed with Microsoft Visual Studio Installer Projects when available.
          $vsRoot = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          $disable = Get-ChildItem $vsRoot -Recurse -Filter DisableOutOfProcBuild.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($disable) {
            Write-Host "Running $($disable.FullName)"
            & $disable.FullName
            if ($LASTEXITCODE -ne 0) { Write-Warning "DisableOutOfProcBuild returned $LASTEXITCODE" }
          }
          else {
            Write-Warning 'DisableOutOfProcBuild.exe not found; applying registry fallback.'
            $keys = @(
              'HKCU:\SOFTWARE\Microsoft\VisualStudio\17.0_Config\MSBuild',
              'HKCU:\SOFTWARE\Microsoft\VisualStudio\17.0\MSBuild'
            )
            foreach ($key in $keys) {
              New-Item -Path $key -Force | Out-Null
              New-ItemProperty -Path $key -Name EnableOutOfProcBuild -Value 0 -PropertyType DWord -Force | Out-Null
            }
          }

          # A failed optional MSI build must not suppress the successfully built VSTO binaries.
          $path = './ci/build-patched.ps1'
          $c = Get-Content $path -Raw
          $c = $c.Replace(
            "Write-Host 'Build preparation complete.'",
            "Write-Host 'Build preparation complete.'`r`nexit 0"
          )
          Set-Content $path $c -Encoding UTF8

      - name: Build patched TextCraft
        shell: pwsh
        run: ./ci/build-patched.ps1

      - name: Upload patched build
        uses: actions/upload-artifact@v4
        with:
          name: TextCraft-patched-scientific-RAG
          path: artifact
          if-no-files-found: error
